<footer class="end" id="contact">
  <p class="label">{{ t.write }}</p>
  <a class="end__mail" href="mailto:{{ profile.email }}" data-goatcounter-click="cta-email-footer" data-subject="{{ t.games.mail_subject | escape }}">{{ profile.email }}</a>
  <div class="end__row">
    <button type="button" class="link" data-goatcounter-click="cta-copy-email" data-copy="{{ profile.email }}" data-copied="{{ t.copied }}">{{ t.copy }}</button>
    <a class="link" href="{{ profile.linkedin }}" data-goatcounter-click="cta-linkedin" rel="me">LinkedIn</a>
    {% if profile.cv %}<a class="link" href="{{ profile.cv | relative_url }}" data-goatcounter-click="cta-cv">CV</a>{% endif %}
    {% if lang == "ja" %}<p class="end__kana" lang="en">{{ profile.name }}</p>{% else %}<p class="end__kana" lang="ja">{{ profile.kana }}</p>{% endif %}
  </div>
</footer>
